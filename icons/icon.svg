<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1f295c"/>
      <stop offset="100%" stop-color="#070a1a"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Glowing Fence Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="16 10" filter="url(#glow)" opacity="0.85"/>

  <!-- Ant Body Group -->
  <g transform="translate(0, 10)">
    <!-- Legs (Left) -->
    <!-- Front Leg -->
    <path d="M230 220 Q170 190 145 220" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Middle Leg -->
    <path d="M230 260 Q160 260 135 285" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Back Leg -->
    <path d="M230 300 Q165 335 150 375" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Legs (Right) -->
    <!-- Front Leg -->
    <path d="M282 220 Q342 190 367 220" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Middle Leg -->
    <path d="M282 260 Q352 260 377 285" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Back Leg -->
    <path d="M282 300 Q347 335 362 375" stroke="#ff4757" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Abdomen (Bottom) -->
    <ellipse cx="256" cy="335" rx="52" ry="68" fill="#ff3838" filter="url(#glow)"/>
    <ellipse cx="256" cy="335" rx="46" ry="60" fill="#2d0b16"/>
    <!-- Stripes on Abdomen -->
    <ellipse cx="256" cy="325" rx="36" ry="8" fill="#ff4757" opacity="0.6"/>
    <ellipse cx="256" cy="350" rx="30" ry="7" fill="#ff4757" opacity="0.6"/>

    <!-- Thorax (Middle) -->
    <ellipse cx="256" cy="245" rx="34" ry="40" fill="#2d0b16" stroke="#ff3838" stroke-width="5"/>

    <!-- Head -->
    <circle cx="256" cy="165" r="42" fill="#2d0b16" stroke="#ff3838" stroke-width="5"/>

    <!-- Antennas -->
    <path d="M242 135 Q210 90 175 95" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="172" cy="95" r="9" fill="#00f3ff" filter="url(#glow)"/>

    <path d="M270 135 Q302 90 337 95" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="340" cy="95" r="9" fill="#00f3ff" filter="url(#glow)"/>

    <!-- Big Cute/Taunting Eyes -->
    <circle cx="240" cy="158" r="14" fill="#ffffff"/>
    <circle cx="243" cy="158" r="8" fill="#0a0e27"/>
    <circle cx="245" cy="155" r="3" fill="#ffffff"/>

    <circle cx="272" cy="158" r="14" fill="#ffffff"/>
    <circle cx="275" cy="158" r="8" fill="#0a0e27"/>
    <circle cx="277" cy="155" r="3" fill="#ffffff"/>

    <!-- Cheerful / Cheeky Mouth -->
    <path d="M246 182 Q256 195 266 182" stroke="#ff3838" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Tongue sticking out -->
    <path d="M251 187 Q256 202 261 187 Z" fill="#ff007f"/>
  </g>
</svg>
